dependencies {
    api project(':grace-views-json')
    api "org.apache.groovy:groovy"
    compileOnly "org.apache.groovy:groovy-json"
    compileOnly "org.graceframework:grace-plugin-rest"
    compileOnly "jakarta.servlet:jakarta.servlet-api"
    compileOnly "org.graceframework:grace-datastore-gorm-mongodb"
}

def compileViews = tasks.register("compileViews", JavaExec) {
    inputs.files 'src/templates'
    outputs.dir 'build/classes/groovy/main'
    mainClass.set("org.grails.views.json.JsonViewCompiler")
    classpath configurations.compileClasspath + configurations.runtimeClasspath
    args("src/templates", "build/classes/groovy/main", "17", ' ', ' ', "none", "UTF-8")
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/templates']
        }
    }
}

classes.dependsOn(compileViews)
