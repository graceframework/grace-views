dependencies {
    api project(":grace-views-core")
    api "org.graceframework:grace-core", {
        exclude group: 'org.graceframework', module: 'grace-datastore-core'
    }
    compileOnly "org.graceframework:grace-plugin-api"
    compileOnly "org.graceframework:grace-plugin-validation"

    api "org.springframework.boot:spring-boot-autoconfigure"
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    testImplementation "org.graceframework:grace-test-support"
    testImplementation project(":grace-views-json-testing-support")
    testImplementation "net.bytebuddy:byte-buddy"
}

jar {
    enabled = true
    archiveClassifier.set('')
    includeEmptyDirs = false
    exclude "*.gson"
}
